name: CI — Tests + Lint + AI Checks

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8 + black check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install flake8>=7.0 black>=24.0
      - name: flake8
        run: flake8 src/ tests/ tools/
        continue-on-error: true
      - name: black check
        run: black --check src/ tests/ tools/
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: |
          python -m pytest tests/unit/ -q --tb=short

      - name: Integration / smoke tests
        if: hashFiles('data/test_sets/set_01/original.csv') != ''
        run: |
          python -m pytest tests/integration/ -q --tb=short
        continue-on-error: true

  ai-checks:
    name: AI Workflow Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run check-repo
        run: python tools/ai_workflow.py check-repo
