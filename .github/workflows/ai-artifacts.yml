name: AI Artifacts Validation

on:
  pull_request:
    paths:
      - '.ai/**'
      - 'tools/ai_workflow.py'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-artifacts:
    name: Validate AI artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check repo health
        run: python tools/ai_workflow.py check-repo

      - name: Validate active task packets
        run: |
          echo "=== Validating active tasks ==="
          found=0
          for task_dir in .ai/tasks/active/*/; do
            if [ -d "$task_dir" ]; then
              task_id=$(basename "$task_dir")
              echo "--- Validating: $task_id ---"
              python tools/ai_workflow.py validate-task "$task_id" || true
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No active tasks found."
          fi

      - name: Validate completed task packets
        run: |
          echo "=== Validating completed tasks ==="
          found=0
          for task_dir in .ai/tasks/completed/*/; do
            if [ -d "$task_dir" ]; then
              task_id=$(basename "$task_dir")
              echo "--- Validating: $task_id ---"
              python tools/ai_workflow.py validate-task "$task_id" || true
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No completed tasks found."
          fi

      - name: Check ADR index consistency
        run: |
          if [ -f .ai/decisions/index.md ]; then
            echo "ADR index found."
          else
            echo "WARNING: ADR index not found."
          fi
