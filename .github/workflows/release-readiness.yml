name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.7.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  readiness:
    name: Release readiness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check repo health
        run: python tools/ai_workflow.py check-repo

      - name: Run full test suite
        run: |
          python -m pytest tests/unit/ -q --tb=short
          python -m pytest tests/integration/ -q --tb=short || true

      - name: Check version consistency
        run: |
          echo "=== Version check ==="
          echo "Requested release: ${{ inputs.version }}"
          echo "pyproject.toml version:"
          grep 'version' pyproject.toml | head -1

      - name: Check for CHANGELOG / release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG.md found"
          elif ls docs/RELEASE_NOTES_*.md 2>/dev/null; then
            echo "Release notes found in docs/"
          else
            echo "WARNING: No CHANGELOG.md or release notes found"
          fi

      - name: Check for secrets in tracked files
        run: |
          echo "Scanning for potential secrets..."
          ! git ls-files | xargs grep -l 'password\|secret\|token\|api_key' 2>/dev/null || echo "WARNING: Potential secrets found"

      - name: Generate readiness report
        run: |
          {
            echo "# Release Readiness Report"
            echo "**Version:** ${{ inputs.version }}"
            echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Commit:** $(git rev-parse HEAD)"
            echo ""
            echo "## Checklist"
            echo "- [ ] All tests passing"
            echo "- [ ] Version consistent"
            echo "- [ ] No tracked secrets"
            echo "- [ ] CHANGELOG updated"
            echo "- [ ] Formula DB compatible"
            echo "- [ ] .exe builds successfully (manual check)"
            echo ""
            echo "## Human approval required"
            echo "This report is auto-generated. Final release decision requires human review."
          } > release_readiness_report.md
          cat release_readiness_report.md

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-${{ inputs.version }}
          path: release_readiness_report.md
          retention-days: 30
