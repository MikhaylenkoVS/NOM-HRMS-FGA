name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Blocking: scan for accidentally committed secrets ────────────────
  secret-scan:
    name: Secret scan (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for common secret patterns
        run: |
          echo "=== Scanning for secrets ==="
          patterns='password|secret|token|api_key|private_key|-----BEGIN'
          matches=$(git ls-files | xargs grep -lE "$patterns" 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "WARNING: Potential secrets found in:"
            echo "$matches"
            echo ""
            echo "Review these files. False positives are common"
            echo "(e.g., 'password' in error messages)."
          else
            echo "No obvious secret patterns found."
          fi

  # ── Advisory: pip-audit finds pre-existing vulnerabilities ───────────
  # TODO(#tech-debt): Resolve pip-audit findings and make blocking.
  # Migration plan: review and fix each vulnerability in a dedicated
  # `tech-debt/resolve-pip-audit-findings` task, then remove continue-on-error.
  dependency-check-advisory:
    name: Dependency audit advisory (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies (advisory)
        run: pip-audit --requirement requirements.txt
