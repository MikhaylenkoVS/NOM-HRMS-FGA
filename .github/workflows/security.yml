name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Basic secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for common secret patterns
        run: |
          echo "=== Scanning for secrets ==="
          patterns='password|secret|token|api_key|private_key|-----BEGIN'
          matches=$(git ls-files | xargs grep -lE "$patterns" 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "WARNING: Potential secrets found in:"
            echo "$matches"
            echo ""
            echo "Review these files. False positives are common"
            echo "(e.g., 'password' in error messages)."
          else
            echo "No obvious secret patterns found."
          fi

  dependency-check:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt
        continue-on-error: true
