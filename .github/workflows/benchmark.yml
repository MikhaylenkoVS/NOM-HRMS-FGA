name: Benchmark

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID associated with this benchmark run'
        required: true
        type: string
      benchmark_id:
        description: 'Registered benchmark identifier'
        required: true
        type: choice
        options:
          - ai-workflow-validation-smoke
      upload_artifact:
        description: 'Upload benchmark output as workflow artifact'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmark (${{ inputs.benchmark_id }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate task packet (blocking)
        run: |
          python tools/ai_workflow.py validate-task "${{ inputs.task_id }}"

      - name: Run benchmark (blocking)
        id: benchmark_run
        run: |
          python tools/run_benchmark.py "${{ inputs.benchmark_id }}" --task-id "${{ inputs.task_id }}"

      - name: Upload benchmark artifact
        if: ${{ always() && inputs.upload_artifact && steps.benchmark_run.outputs.report_created == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.benchmark_run.outputs.report_dir }}
          retention-days: 30
          if-no-files-found: error

      - name: Note about baseline update
        if: ${{ always() }}
        run: |
          echo ""
          echo "========================================="
          echo "Benchmark completed."
          echo "Report status: ${{ steps.benchmark_run.outputs.report_status || 'unknown' }}"
          echo "Manual baseline update: .ai/baselines/"
          echo "========================================="
