[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nom-hrms-fga"
version = "0.7.0"
description = "NOM HRMS FGA: functional-group analyzer for natural organic matter (NOM) mass spectra"
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Vladimir S. Mikhaylenko", email = "mikhaylenkovs@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "rdkit>=2023.9",
    "Pillow>=9.0",
    "zstandard>=0.22",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # Покрытие кода: без него доля протестированных ветвей не измеряется.
    # Обоснование (AGENTS.md, правило 7): используется в CI-шаге «Unit tests»
    # (--cov=src) и локально; не является runtime-зависимостью.
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
]
raw = [
    "pythonnet>=3.0",
]

[project.scripts]
nom-hrms-fga = "src.app:main"
nom-hrms-fga-cli = "src.cli:main"

[project.urls]
Homepage = "https://github.com/MikhaylenkoVS/NOM-HRMS-FGA"
Repository = "https://github.com/MikhaylenkoVS/NOM-HRMS-FGA"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "external*", "docs*"]

[tool.setuptools.package-data]
# Все JSON-конфиги обязаны попадать в дистрибутив: src/configs/loader.py
# загружает часть из них (noise, isotope) на уровне модуля, поэтому их
# отсутствие делает пакет неработоспособным сразу после установки.
src = [
    "configs/*.json",
    "configs/constants/*.json",
    "configs/presets/*.json",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "slow: slow tests",
    "integration: integration tests",
    "unit: unit tests",
    "smoke: smoke tests",
]
# Маркеры unit/integration/smoke проставляются автоматически по расположению
# файла — см. pytest_collection_modifyitems в tests/conftest.py.

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

